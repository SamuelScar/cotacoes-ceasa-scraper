x-app: &app
  image: cotacoes-ceasa-scraper:dev
  build:
    context: .
  working_dir: /app
  environment:
    PYTHONPATH: /app/src
    PYTHONUNBUFFERED: "1"
  volumes:
    - .:/app

services:
  app:
    <<: *app

  baixar:
    <<: *app
    command: ["--download-only"]

  salvar:
    <<: *app
    command: ["--process-raw"]

  tudo:
    <<: *app
    command: ["--download-and-process"]

  compactar-old:
    <<: *app
    command: ["--archive-raw-old"]

  otimizar-pdfs:
    <<: *app
    entrypoint: ["python", "scripts/otimizar_pdfs_qpdf.py"]

  complementar-prohort:
    <<: *app
    command: ["--complement-prohort"]

  sincronizar-supabase:
    <<: *app
    command: ["--sync-supabase"]

  substituir-supabase:
    <<: *app
    command: ["--replace-supabase"]

  migrar-supabase-pgloader:
    image: dimitri/pgloader:latest
    working_dir: /app
    environment:
      COTACOES_SUPABASE_DATABASE_URL: ${COTACOES_SUPABASE_DATABASE_URL}
      TZ: America/Sao_Paulo
    volumes:
      - .:/app
    entrypoint: ["/bin/sh", "/app/scripts/migrar_supabase_pgloader.sh"]
