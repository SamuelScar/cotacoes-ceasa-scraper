x-app: &app
  image: cotacoes-ceasa-scraper:dev
  build:
    context: .
  working_dir: /app
  environment:
    PYTHONPATH: /app/src
    PYTHONUNBUFFERED: "1"
  volumes:
    - .:/app

services:
  app:
    <<: *app

  baixar:
    <<: *app
    command: ["--all-sources"]

  salvar:
    <<: *app
    command: ["--all-sources", "--process-raw"]

  tudo:
    <<: *app
    command: ["--all-sources", "--download-and-process"]

  compactar-old:
    <<: *app
    command: ["--archive-raw-old"]

  complementar-prohort:
    <<: *app
    command: ["--complement-prohort"]
