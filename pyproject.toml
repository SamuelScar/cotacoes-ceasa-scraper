[project]
name = "cotacoes-ceasa-scraper"
version = "0.1.0"
description = "Scraper para cotacoes publicas de CEASAs brasileiras."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pypdf>=5.0.0",
    "psycopg[binary]>=3.2.0",
    "tzdata>=2025.2",
]

[project.scripts]
cotacoes-ceasa = "cotacoes_ceasa.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
