name: Enviar relatorio por email
description: Envia um relatorio Markdown explicito por SMTP, se os secrets estiverem configurados.

inputs:
  report-path:
    required: true
    description: Caminho do relatorio Markdown da execucao atual.

runs:
  using: composite
  steps:
    - name: Enviar email
      shell: bash
      env:
        REPORT_PATH: ${{ inputs.report-path }}
      run: |
        set -euo pipefail

        if [ "${COTACOES_SEND_REPORT_EMAIL:-true}" != "true" ]; then
          echo "Envio de relatorio por email desativado por COTACOES_SEND_REPORT_EMAIL."
          exit 0
        fi

        if [ -z "${SMTP_HOST}" ] || [ -z "${SMTP_PORT}" ] || [ -z "${SMTP_USER}" ] || [ -z "${SMTP_PASSWORD}" ] || [ -z "${REPORT_EMAIL_FROM}" ] || [ -z "${REPORT_EMAIL_TO}" ]; then
          echo "Secrets de email nao configurados. Pulando envio do relatorio."
          exit 0
        fi

        if [ ! -f "$REPORT_PATH" ]; then
          echo "Relatorio da execucao atual nao encontrado: $REPORT_PATH"
          exit 0
        fi

        echo "Enviando relatorio: ${REPORT_PATH}"
        python - <<'PY'
        import os
        import smtplib
        from email.message import EmailMessage
        from pathlib import Path

        report_path = Path(os.environ["REPORT_PATH"])
        status = os.environ.get("WORKFLOW_STATUS", "desconhecido")

        message = EmailMessage()
        message["Subject"] = f"CEASA scraper finalizado: {status}"
        message["From"] = os.environ["REPORT_EMAIL_FROM"]
        message["To"] = os.environ["REPORT_EMAIL_TO"]
        message.set_content(
            "Execucao do scraper CEASA finalizada.\n\n"
            f"Status do workflow: {status}\n"
            f"Relatorio anexado: {report_path.name}\n"
        )

        message.add_attachment(
            report_path.read_bytes(),
            maintype="text",
            subtype="markdown",
            filename=report_path.name,
        )

        with smtplib.SMTP(os.environ["SMTP_HOST"], int(os.environ["SMTP_PORT"])) as smtp:
            smtp.starttls()
            smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_PASSWORD"])
            smtp.send_message(message)
        PY
