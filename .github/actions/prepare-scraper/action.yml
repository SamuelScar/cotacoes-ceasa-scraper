name: Preparar configuracao do scraper
description: Cria o arquivo .env usado pelo scraper no runner.

inputs:
  target-date:
    required: true
    description: Data limite da coleta.
  quotes-back:
    required: true
    description: Quantidade de cotacoes anteriores.
  incremental-history:
    required: true
    description: Habilita ou desabilita historico incremental.
  workers:
    required: true
    description: Quantidade de workers do scraper.
  request-delay-seconds:
    required: true
    description: Intervalo entre requisicoes.

runs:
  using: composite
  steps:
    - name: Criar .env
      shell: bash
      run: |
        set -euo pipefail
        cat > .env <<EOF
        COTACOES_SOURCES_FILE=config/fontes.json
        COTACOES_RAW_DIR=data/raw
        COTACOES_PDF_TEXT_CACHE_DIR=data/cache/pdf-text
        COTACOES_DATABASE_PATH=data/cotacoes.sqlite
        COTACOES_SUPABASE_DATABASE_URL=
        COTACOES_SUPABASE_BATCH_SIZE=5000
        COTACOES_HTTP_TIMEOUT_SECONDS=30
        COTACOES_REQUEST_DELAY_SECONDS=${{ inputs.request-delay-seconds }}
        COTACOES_WORKERS=${{ inputs.workers }}
        COTACOES_REUSE_RAW_BEFORE_REQUEST=false
        COTACOES_INCREMENTAL_HISTORY=${{ inputs.incremental-history }}
        COTACOES_COMPLEMENT_PROHORT=false
        COTACOES_TARGET_DATE=${{ inputs.target-date }}
        COTACOES_QUOTES_BACK=${{ inputs.quotes-back }}
        EOF
        sed -i 's/^        //' .env
        echo "Configuracao criada em .env sem credenciais."
