name: Publicar dados na release
description: Cria a release fixa se necessario, valida o asset e publica o novo.

inputs:
  release-tag:
    required: true
    description: Tag da release fixa.
  asset-name:
    required: true
    description: Nome do asset publicado.
  max-asset-size-bytes:
    required: false
    default: "2147483647"
    description: Tamanho maximo aceito pelo GitHub Release Asset.

outputs:
  duration_seconds:
    description: Duracao da publicacao.
    value: ${{ steps.publish_asset.outputs.duration_seconds }}
  asset_size:
    description: Tamanho do asset publicado.
    value: ${{ steps.publish_asset.outputs.asset_size }}
  removed_legacy_assets:
    description: Pacotes completos legados removidos da release.
    value: ${{ steps.publish_asset.outputs.removed_legacy_assets }}

runs:
  using: composite
  steps:
    - name: Publicar asset
      id: publish_asset
      shell: bash
      run: |
        set -euo pipefail
        started_at="$(date +%s)"
        removed_legacy_assets=""

        write_outputs() {
          local finished_at duration
          finished_at="$(date +%s)"
          duration=$((finished_at - started_at))

          {
            echo "duration_seconds=${duration}"
            echo "asset_size=${asset_size:-nao identificado}"
            echo "removed_legacy_assets=${removed_legacy_assets:-nenhum}"
          } >> "$GITHUB_OUTPUT"
        }

        trap write_outputs EXIT

        if [ ! -f "${{ inputs.asset-name }}" ]; then
          echo "Asset local nao encontrado: ${{ inputs.asset-name }}"
          exit 1
        fi

        asset_size=$(stat -c%s "${{ inputs.asset-name }}")
        max_asset_size="${{ inputs.max-asset-size-bytes }}"

        echo "Tamanho do asset: ${asset_size} bytes."
        echo "Limite configurado: ${max_asset_size} bytes."

        if [ "$asset_size" -gt "$max_asset_size" ]; then
          echo "Asset maior que o limite configurado. A release nao sera alterada."
          exit 1
        fi

        if gh release view "${{ inputs.release-tag }}" >/dev/null 2>&1; then
          echo "Release ${{ inputs.release-tag }} ja existe."
        else
          echo "Criando release ${{ inputs.release-tag }}."
          gh release create "${{ inputs.release-tag }}" \
            --title "Dados CEASA mais recentes" \
            --notes "Dados atualizados automaticamente pelo GitHub Actions."
        fi

        release_assets="$(gh release view "${{ inputs.release-tag }}" --json assets --jq '.assets[].name')"
        legacy_assets=(
          "ceasa-data-latest.tar.gz"
          "ceasa-data-latest.tar.xz"
          "ceasa-data-full-latest.tar.gz"
          "ceasa-data-full-latest.tar.xz"
        )

        for legacy_asset in "${legacy_assets[@]}"; do
          if [ "$legacy_asset" = "${{ inputs.asset-name }}" ]; then
            continue
          fi

          if printf "%s\n" "$release_assets" | grep -Fx "$legacy_asset" >/dev/null; then
            echo "Removendo pacote completo legado da release: $legacy_asset."
            gh release delete-asset "${{ inputs.release-tag }}" "$legacy_asset" -y
            if [ -z "$removed_legacy_assets" ]; then
              removed_legacy_assets="$legacy_asset"
            else
              removed_legacy_assets="${removed_legacy_assets}, ${legacy_asset}"
            fi
          fi
        done

        if gh release view "${{ inputs.release-tag }}" --json assets --jq '.assets[].name' | grep -Fx "${{ inputs.asset-name }}" >/dev/null; then
          echo "Removendo asset antigo ${{ inputs.asset-name }}."
          gh release delete-asset "${{ inputs.release-tag }}" "${{ inputs.asset-name }}" -y
        else
          echo "Nenhum asset antigo com nome ${{ inputs.asset-name }}."
        fi

        echo "Enviando novo asset ${{ inputs.asset-name }}."
        gh release upload "${{ inputs.release-tag }}" "${{ inputs.asset-name }}"
