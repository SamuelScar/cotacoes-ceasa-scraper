name: Restaurar dados
description: Baixa e restaura o pacote completo do OneDrive ou o banco da release fixa.

inputs:
  release-tag:
    required: true
    description: Tag da release fixa.
  asset-name:
    required: true
    description: Nome do banco compactado da release.
  backup-asset-name:
    required: false
    default: ""
    description: Nome do pacote completo salvo no OneDrive.
  backup-enabled:
    required: false
    default: "false"
    description: Define se deve tentar restaurar do OneDrive quando a release falhar.
  rclone-config:
    required: false
    default: ""
    description: Conteudo do arquivo rclone.conf.
  rclone-remote:
    required: false
    default: "onedrive"
    description: Nome do remote configurado no rclone.
  backup-dir:
    required: false
    default: "cotacoes-ceasa"
    description: Diretorio base do backup dentro do OneDrive.

outputs:
  restored:
    description: Define se algum dado foi restaurado.
    value: ${{ steps.restore_data.outputs.restored }}
  restored_source:
    description: Origem restaurada.
    value: ${{ steps.restore_data.outputs.restored_source }}
  restored_asset:
    description: Asset restaurado.
    value: ${{ steps.restore_data.outputs.restored_asset }}
  duration_seconds:
    description: Duracao total da restauracao.
    value: ${{ steps.restore_data.outputs.duration_seconds }}
  data_size:
    description: Tamanho final de data/.
    value: ${{ steps.restore_data.outputs.data_size }}

runs:
  using: composite
  steps:
    - name: Restaurar data
      id: restore_data
      shell: bash
      env:
        RCLONE_CONFIG_CONTENT: ${{ inputs.rclone-config }}
      run: |
        set -euo pipefail
        started_at="$(date +%s)"
        restored=false
        restored_source="none"
        restored_asset=""
        backup_asset_name="${{ inputs.backup-asset-name }}"

        write_outputs() {
          local finished_at duration data_size
          finished_at="$(date +%s)"
          duration=$((finished_at - started_at))
          data_size="$(du -sh data 2>/dev/null | cut -f 1 || true)"
          data_size="${data_size:-nao gerado}"

          {
            echo "restored=${restored}"
            echo "restored_source=${restored_source}"
            echo "restored_asset=${restored_asset}"
            echo "duration_seconds=${duration}"
            echo "data_size=${data_size}"
          } >> "$GITHUB_OUTPUT"
        }

        trap write_outputs EXIT

        if [ -z "$backup_asset_name" ]; then
          backup_asset_name="${{ inputs.asset-name }}"
        fi

        if [ "${{ inputs.backup-enabled }}" = "true" ]; then
          echo "Tentando restaurar pacote completo pelo OneDrive."
          rclone_remote="${{ inputs.rclone-remote }}"
          backup_dir="${{ inputs.backup-dir }}"

          if [ -z "$RCLONE_CONFIG_CONTENT" ] || [ -z "$rclone_remote" ] || [ -z "$backup_dir" ]; then
            echo "Backup OneDrive incompleto. A release sera tentada como fallback."
            rclone_ready=false
          else
            rclone_ready=true
          fi

          if [ "${rclone_ready:-false}" = "true" ] && ! command -v rclone >/dev/null 2>&1; then
            if ! sudo apt-get update || ! sudo apt-get install -y rclone; then
              echo "Nao foi possivel instalar rclone. A release sera tentada como fallback."
              rclone_ready=false
            fi
          fi

          if [ "${rclone_ready:-false}" = "true" ]; then
            rclone_config_dir="${RUNNER_TEMP}/rclone"
            mkdir -p "$rclone_config_dir"
            chmod 700 "$rclone_config_dir"
            printf "%s\n" "$RCLONE_CONFIG_CONTENT" > "${rclone_config_dir}/rclone.conf"
            chmod 600 "${rclone_config_dir}/rclone.conf"
            export RCLONE_CONFIG="${rclone_config_dir}/rclone.conf"

            backup_dir="${backup_dir%/}"
            latest_path="${backup_dir}/latest/${backup_asset_name}"
            echo "Tentando restaurar ${rclone_remote}:${latest_path}."

            if rclone copyto "${rclone_remote}:${latest_path}" "$backup_asset_name" --progress; then
              if docker compose run --rm --entrypoint python app \
                scripts/cotacoes.py descompactar --incluir-sqlite --arquivo "$backup_asset_name"; then
                restored=true
                restored_source="onedrive"
                restored_asset="$backup_asset_name"
              else
                echo "Falha ao descompactar pacote completo $backup_asset_name. A release sera tentada como fallback."
                rm -f "$backup_asset_name"
              fi
            else
              echo "Backup $backup_asset_name nao encontrado ou indisponivel."
            fi

            if [ "$restored" != "true" ]; then
              echo "Nenhum backup OneDrive foi restaurado. A release sera tentada como fallback."
            fi
          fi
        fi

        if [ "$restored" = "false" ] && gh release view "${{ inputs.release-tag }}" >/dev/null 2>&1; then
          echo "Release ${{ inputs.release-tag }} encontrada. Tentando baixar banco ${{ inputs.asset-name }}."
          if gh release download "${{ inputs.release-tag }}" --pattern "${{ inputs.asset-name }}" --clobber; then
            echo "Banco atual baixado."
            if docker compose run --rm --entrypoint python app \
              scripts/cotacoes.py descompactar-banco --arquivo "${{ inputs.asset-name }}"; then
              restored=true
              restored_source="github-release-database"
              restored_asset="${{ inputs.asset-name }}"
            else
              echo "Falha ao restaurar banco da release."
              rm -f "${{ inputs.asset-name }}"
            fi
          else
            echo "Banco ${{ inputs.asset-name }} nao encontrado na release."
          fi
        fi

        if [ "$restored" != "true" ]; then
          echo "::error::Nenhum dado anterior foi restaurado. O scraper nao sera executado para evitar publicar uma base incompleta."
          exit 1
        fi

        mkdir -p data
        echo "Conteudo inicial de data/:"
        du -sh data || true
        find data -maxdepth 2 -type f | head -n 20 || true
