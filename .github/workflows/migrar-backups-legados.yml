  finalizar-migracao-historica:
    name: Validar e limpar historico legado
    if: inputs.mode == 'history-apply'
    needs:
      - planejar-historico
      - migrar-historico-lote-3
    runs-on: ubuntu-latest
    environment: Crawler
    timeout-minutes: 60
    env:
      DATA_MIGRATION_LOCKED: ${{ vars.DATA_MIGRATION_LOCKED || 'false' }}
      MIGRATION_RUNTIME_DIR: .migration-work/${{ github.run_id }}_${{ github.run_attempt }}

    steps:
      - name: Exigir trava da migracao
        run: |
          set -euo pipefail
          if [ "${DATA_MIGRATION_LOCKED,,}" != "true" ]; then
            echo "::error::Ative DATA_MIGRATION_LOCKED=true antes da limpeza final."
            exit 1
          fi

      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build da imagem Docker
        run: docker compose build

      - name: Baixar plano historico aprovado
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.planejar-historico.outputs.plan_artifact_name }}
          path: ${{ env.MIGRATION_RUNTIME_DIR }}/approved-plan

      - name: Preparar acesso ao OneDrive
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "::error::O secret RCLONE_CONFIG nao esta configurado."
            exit 1
          fi
          mkdir -p "${MIGRATION_RUNTIME_DIR}/finalization"
          chmod 700 "$MIGRATION_RUNTIME_DIR"
          printf "%s\n" "$RCLONE_CONFIG_CONTENT" > "${MIGRATION_RUNTIME_DIR}/rclone.conf"
          chmod 600 "${MIGRATION_RUNTIME_DIR}/rclone.conf"

      - name: Registrar versao do rclone
        run: docker compose run --rm --entrypoint rclone app version

      - name: Validar camadas e remover legados aprovados
        id: finalizar_historico
        continue-on-error: true
        env:
          APPROVED_PLAN_SHA256: ${{ needs.planejar-historico.outputs.plan_sha256 }}
          CLEANUP_CONFIRMATION: ${{ inputs.cleanup_confirmation }}
        run: |
          set -euo pipefail

          results_dir="${MIGRATION_RUNTIME_DIR}/finalization"
          config_path="${MIGRATION_RUNTIME_DIR}/rclone.conf"
          plan_path="${MIGRATION_RUNTIME_DIR}/approved-plan/migration-history-plan.json"
          result_path="${results_dir}/migration-history-finalization.json"
          report_path="${results_dir}/migration-history-finalization.md"
          execution_id="history_finalize_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"

          docker compose run --rm \
            --user "$(id -u):$(id -g)" \
            -e RCLONE_CONFIG="/app/${config_path}" \
            -e DATA_MIGRATION_LOCKED \
            -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT \
            -e GITHUB_SHA \
            -e GITHUB_REF \
            -e GITHUB_WORKFLOW \
            -e GITHUB_JOB \
            -e RUNNER_OS \
            -e RUNNER_ARCH \
            -e RUNNER_NAME \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python \
            app scripts/migrar_backups_legados.py history-finalize \
            --plano-aprovado "/app/${plan_path}" \
            --plan-sha256 "$APPROVED_PLAN_SHA256" \
            --confirmacao "$CLEANUP_CONFIRMATION" \
            --execution-id "$execution_id" \
            --resultado "/app/${result_path}" \
            --relatorio "/app/${report_path}" \
            --workspace /app

      - name: Publicar resumo do encerramento
        if: always()
        run: |
          report_path="${MIGRATION_RUNTIME_DIR}/finalization/migration-history-finalization.md"
          if [ -f "$report_path" ]; then
            cat "$report_path" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "O encerramento historico nao gerou relatorio." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo
            echo 'Revise todas as evidencias antes de alterar `DATA_MIGRATION_LOCKED`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preservar evidencias consolidadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-history-finalization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MIGRATION_RUNTIME_DIR }}/finalization/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Remover configuracao temporaria
        if: always()
        run: rm -f -- "${MIGRATION_RUNTIME_DIR}/rclone.conf"

      - name: Consolidar encerramento
        if: always()
        run: |
          if [ "${{ steps.finalizar_historico.outcome }}" != "success" ]; then
            echo "::error::O encerramento falhou. Mantenha DATA_MIGRATION_LOCKED=true."
            exit 1
          fi
          echo "Migracao historica concluida. Revise as evidencias antes do desbloqueio manual."
