name: Recuperar e auditar raws historicos

on:
  workflow_dispatch:
    inputs:
      planning_run_id:
        description: Run ID que gerou o plano consolidado.
        required: true
        type: string
        default: "40902268908"
      planning_run_attempt:
        description: Tentativa do run de planejamento.
        required: true
        type: string
        default: "1"

permissions:
  actions: read
  contents: read

concurrency:
  group: latest-data-release
  cancel-in-progress: false

jobs:
  recuperar_e_auditar:
    name: Criar e validar copia candidata
    runs-on: ubuntu-latest
    environment: Crawler
    timeout-minutes: 360
    env:
      DATA_MIGRATION_LOCKED: ${{ vars.DATA_MIGRATION_LOCKED || 'false' }}
      DATA_ONEDRIVE_BACKUP_ENABLED: ${{ vars.DATA_ONEDRIVE_BACKUP_ENABLED || 'false' }}
      DATA_ONEDRIVE_REMOTE: ${{ vars.DATA_ONEDRIVE_REMOTE || 'onedrive' }}
      DATA_ONEDRIVE_DIR: ${{ vars.DATA_ONEDRIVE_DIR || 'cotacoes-ceasa' }}
      DATA_RELEASE_TAG: ${{ vars.DATA_RELEASE_TAG || 'latest-data' }}
      DATA_ASSET_NAME: ${{ vars.DATA_ASSET_NAME || 'cotacoes.sqlite.xz' }}
      DATA_ONEDRIVE_LATEST_ASSET_NAME: ceasa-data-latest.zip
      PLANNING_RUN_ID: ${{ inputs.planning_run_id }}
      PLANNING_RUN_ATTEMPT: ${{ inputs.planning_run_attempt }}

    steps:
      - name: Liberar recuperacao candidata
        id: janela
        run: |
          set -euo pipefail

          case "${DATA_MIGRATION_LOCKED,,}" in
            true)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              {
                echo "## Recuperacao bloqueada"
                echo
                echo 'A variavel `DATA_MIGRATION_LOCKED` esta ativa.'
                echo 'Nenhum checkout, download ou processamento foi executado.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            false) ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "::error::DATA_MIGRATION_LOCKED deve ser true ou false."
              exit 1
              ;;
          esac

          if [ "${DATA_ONEDRIVE_BACKUP_ENABLED,,}" != "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::error::DATA_ONEDRIVE_BACKUP_ENABLED precisa estar ativa."
            exit 1
          fi
          case "$PLANNING_RUN_ID" in
            ''|*[!0-9]*)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "::error::planning_run_id deve conter somente numeros."
              exit 1
              ;;
          esac
          case "$PLANNING_RUN_ATTEMPT" in
            ''|*[!0-9]*)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "::error::planning_run_attempt deve conter somente numeros."
              exit 1
              ;;
          esac
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout do codigo
        if: steps.janela.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Criar configuracao do auditor
        if: steps.janela.outputs.should_run == 'true'
        uses: ./.github/actions/prepare-scraper
        with:
          target-date: ""
          quotes-back: "100"
          incremental-history: "false"
          workers: "1"
          request-delay-seconds: "7.0"
          complement-prohort: "false"

      - name: Build da imagem Docker
        if: steps.janela.outputs.should_run == 'true'
        run: docker compose build app

      - name: Restaurar pacote completo atual
        id: restaurar_data
        if: steps.janela.outputs.should_run == 'true'
        uses: ./.github/actions/restore-release-data
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release-tag: ${{ env.DATA_RELEASE_TAG }}
          asset-name: ${{ env.DATA_ASSET_NAME }}
          backup-asset-name: ${{ env.DATA_ONEDRIVE_LATEST_ASSET_NAME }}
          backup-enabled: "true"
          rclone-config: ${{ secrets.RCLONE_CONFIG }}
          rclone-remote: ${{ env.DATA_ONEDRIVE_REMOTE }}
          backup-dir: ${{ env.DATA_ONEDRIVE_DIR }}

      - name: Exigir pacote completo validado
        id: validar_origem
        if: steps.janela.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          if [ "${{ steps.restaurar_data.outputs.restored_source }}" != "onedrive" ]; then
            echo "::error::A recuperacao exige o pacote completo do OneDrive."
            exit 1
          fi
          if [ "${{ steps.restaurar_data.outputs.validation_status }}" != "passed" ] \
            || [ "${{ steps.restaurar_data.outputs.checksum_validation }}" != "passed" ]; then
            echo "::error::O pacote atual nao passou pela validacao integral."
            exit 1
          fi

      - name: Baixar plano consolidado
        if: steps.janela.outputs.should_run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: plano-recuperacao-raws-${{ inputs.planning_run_id }}-${{ inputs.planning_run_attempt }}
          path: .raw-recovery-input/plan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.planning_run_id }}

      - name: Preparar diretorios e credencial
        id: contexto
        if: steps.janela.outputs.should_run == 'true'
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail

          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "::error::O secret RCLONE_CONFIG nao esta configurado."
            exit 1
          fi
          plan_dir=".raw-recovery-input/plan"
          plan_path="${plan_dir}/plano-recuperacao-raws.csv"
          planning_result="${plan_dir}/resultado.json"
          if [ ! -f "$plan_path" ] || [ ! -f "$planning_result" ]; then
            echo "::error::O artefato nao possui o plano consolidado esperado."
            exit 1
          fi

          runtime_dir=".raw-recovery-run/${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          output_dir="${runtime_dir}/results"
          config_path="${runtime_dir}/rclone.conf"
          mkdir -p "$output_dir"
          chmod 700 "$runtime_dir"
          printf "%s\n" "$RCLONE_CONFIG_CONTENT" > "$config_path"
          chmod 600 "$config_path"

          {
            echo "RAW_RECOVERY_PLAN=${plan_path}"
            echo "RAW_RECOVERY_PLANNING_RESULT=${planning_result}"
            echo "RAW_RECOVERY_RUNTIME=${runtime_dir}"
            echo "RAW_RECOVERY_OUTPUT=${output_dir}"
            echo "RAW_RECOVERY_ARCHIVES=${runtime_dir}/archives"
            echo "RAW_RECOVERY_MANIFESTS=${runtime_dir}/manifests"
            echo "RAW_RECOVERY_CANDIDATE=${runtime_dir}/candidate"
            echo "RAW_RECOVERY_WORK=${runtime_dir}/work"
            echo "RAW_RECOVERY_RCLONE_CONFIG=${config_path}"
          } >> "$GITHUB_ENV"
          echo "output_dir=${output_dir}" >> "$GITHUB_OUTPUT"

      - name: Baixar somente os insumos do plano
        id: insumos
        if: steps.janela.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail

          docker compose run --rm \
            --user "$(id -u):$(id -g)" \
            -e RCLONE_CONFIG="/app/${RAW_RECOVERY_RCLONE_CONFIG}" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python \
            app scripts/preparar_insumos_recuperacao_raws.py \
            --plano "/app/${RAW_RECOVERY_PLAN}" \
            --resultado-planejamento "/app/${RAW_RECOVERY_PLANNING_RESULT}" \
            --remote "$DATA_ONEDRIVE_REMOTE" \
            --raiz-remota "$DATA_ONEDRIVE_DIR" \
            --arquivos-backup "/app/${RAW_RECOVERY_ARCHIVES}" \
            --manifestos "/app/${RAW_RECOVERY_MANIFESTS}" \
            --inventario "/app/${RAW_RECOVERY_OUTPUT}/insumos.json"

      - name: Criar copia candidata e recuperar raws
        id: recuperar
        if: steps.insumos.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail

          docker compose run --rm \
            --user "$(id -u):$(id -g)" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python \
            app scripts/recuperar_raws_planejados.py \
            --data-atual /app/data \
            --plano "/app/${RAW_RECOVERY_PLAN}" \
            --resultado-planejamento "/app/${RAW_RECOVERY_PLANNING_RESULT}" \
            --arquivos-backup "/app/${RAW_RECOVERY_ARCHIVES}" \
            --manifestos "/app/${RAW_RECOVERY_MANIFESTS}" \
            --candidata "/app/${RAW_RECOVERY_CANDIDATE}" \
            --trabalho "/app/${RAW_RECOVERY_WORK}" \
            --resultado "/app/${RAW_RECOVERY_OUTPUT}/recuperacao.json" \
            --relatorio "/app/${RAW_RECOVERY_OUTPUT}/recuperacao.md"

      - name: Executar auditoria integral na candidata
        id: auditar
        if: steps.recuperar.outcome == 'success'
        continue-on-error: true
        env:
          COTACOES_AUDIT_RELEASE_TAG: ${{ env.DATA_RELEASE_TAG }}
          COTACOES_AUDIT_PACKAGE_NAME: candidata-recuperacao-raws
          COTACOES_AUDIT_RESTORED_SOURCE: copia-candidata
          COTACOES_AUDIT_RESTORED_ASSET: plano-${{ inputs.planning_run_id }}
        run: |
          set -euo pipefail

          docker compose run --rm \
            --user "$(id -u):$(id -g)" \
            -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT \
            -e GITHUB_EVENT_NAME \
            -e GITHUB_REF \
            -e GITHUB_SHA \
            -e RUNNER_OS \
            -e RUNNER_ARCH \
            -e RUNNER_NAME \
            -e COTACOES_AUDIT_RELEASE_TAG \
            -e COTACOES_AUDIT_PACKAGE_NAME \
            -e COTACOES_AUDIT_RESTORED_SOURCE \
            -e COTACOES_AUDIT_RESTORED_ASSET \
            --entrypoint python \
            app auditar_banco.py \
            --database "/app/${RAW_RECOVERY_CANDIDATE}/data/cotacoes.sqlite" \
            --output "/app/${RAW_RECOVERY_OUTPUT}/auditoria" \
            --verify-raw \
            --full-integrity-check

      - name: Consolidar recuperacao e auditoria
        id: consolidar
        if: steps.auditar.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail

          docker compose run --rm \
            --user "$(id -u):$(id -g)" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python \
            app scripts/consolidar_recuperacao_raws.py \
            --planejamento "/app/${RAW_RECOVERY_PLANNING_RESULT}" \
            --recuperacao "/app/${RAW_RECOVERY_OUTPUT}/recuperacao.json" \
            --auditoria "/app/${RAW_RECOVERY_OUTPUT}/auditoria/resultado.json" \
            --resultado "/app/${RAW_RECOVERY_OUTPUT}/resultado-final.json" \
            --relatorio "/app/${RAW_RECOVERY_OUTPUT}/resumo-final.md"

      - name: Publicar resumo da recuperacao
        if: always() && steps.contexto.outcome == 'success'
        run: |
          report_path="${RAW_RECOVERY_OUTPUT}/resumo-final.md"
          if [ -f "$report_path" ]; then
            cat "$report_path" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Recuperacao dos raws historicos"
              echo
              echo "A execucao nao chegou ao relatorio consolidado."
              echo
              echo "- Insumos: \`${{ steps.insumos.outcome }}\`"
              echo "- Recuperacao: \`${{ steps.recuperar.outcome }}\`"
              echo "- Auditoria: \`${{ steps.auditar.outcome }}\`"
              echo "- Consolidacao: \`${{ steps.consolidar.outcome }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preservar somente evidencias e relatorios
        if: always() && steps.contexto.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: recuperacao-raws-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.contexto.outputs.output_dir }}/
          if-no-files-found: error
          retention-days: 90

      - name: Remover credencial temporaria
        if: always() && steps.contexto.outcome == 'success'
        run: rm -f -- "$RAW_RECOVERY_RCLONE_CONFIG"

      - name: Consolidar resultado do workflow
        if: always() && steps.janela.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          if [ "${{ steps.restaurar_data.outcome }}" != "success" ] \
            || [ "${{ steps.validar_origem.outcome }}" != "success" ]; then
            echo "::error::O pacote atual nao foi restaurado e validado."
            exit 1
          fi
          if [ "${{ steps.insumos.outcome }}" != "success" ]; then
            echo "::error::O download controlado dos insumos falhou."
            exit 1
          fi
          if [ "${{ steps.recuperar.outcome }}" != "success" ]; then
            echo "::error::A recuperacao candidata falhou."
            exit 1
          fi
          if [ "${{ steps.auditar.outcome }}" != "success" ]; then
            echo "::error::A auditoria integral da candidata falhou."
            exit 1
          fi
          if [ "${{ steps.consolidar.outcome }}" != "success" ]; then
            echo "::error::As evidencias finais sao divergentes."
            exit 1
          fi
          echo "Copia candidata recuperada e auditada sem publicacao."
