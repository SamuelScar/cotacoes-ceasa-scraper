name: Atualizar pacote de dados

on:
  workflow_dispatch:
    inputs:
      bypass_publication_gate:
        description: Publicar a Release mesmo se o gate por fonte reprovar
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 9 * * *"
    - cron: "17 15 * * *"
    - cron: "17 21 * * *"

permissions:
  contents: write

concurrency:
  group: latest-data-release
  cancel-in-progress: false

jobs:
  atualizar-dados:
    name: Gerar e publicar dados
    runs-on: ubuntu-latest
    environment: Crawler
    timeout-minutes: 360
    env:
      DATA_RELEASE_TAG: ${{ vars.DATA_RELEASE_TAG || 'latest-data' }}
      DATA_ASSET_NAME: ${{ vars.DATA_ASSET_NAME || 'cotacoes.sqlite.xz' }}
      DATA_ONEDRIVE_BACKUP_ENABLED: ${{ vars.DATA_ONEDRIVE_BACKUP_ENABLED || 'false' }}
      DATA_ONEDRIVE_REMOTE: ${{ vars.DATA_ONEDRIVE_REMOTE || 'onedrive' }}
      DATA_ONEDRIVE_DIR: ${{ vars.DATA_ONEDRIVE_DIR || 'cotacoes-ceasa' }}
      DATA_ONEDRIVE_DAILY_RETENTION_DAYS: ${{ vars.DATA_ONEDRIVE_DAILY_RETENTION_DAYS || '7' }}
      DATA_ONEDRIVE_DEEP_RETENTION_DAYS: ${{ vars.DATA_ONEDRIVE_DEEP_RETENTION_DAYS || '30' }}
      DATA_ONEDRIVE_AUDIT_RETENTION_DAYS: ${{ vars.DATA_ONEDRIVE_AUDIT_RETENTION_DAYS || '365' }}
      DATA_MIGRATION_LOCKED: ${{ vars.DATA_MIGRATION_LOCKED || 'false' }}
      COTACOES_EXECUTION_RETENTION_DAYS: ${{ vars.COTACOES_EXECUTION_RETENTION_DAYS || '30' }}
      COTACOES_EXECUTION_RETENTION_COUNT: ${{ vars.COTACOES_EXECUTION_RETENTION_COUNT || '120' }}

    steps:
      - name: Liberar execucao
        id: janela
        run: |
          set -euo pipefail

          migration_locked="${DATA_MIGRATION_LOCKED,,}"
          case "$migration_locked" in
            true)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "migration_locked=true" >> "$GITHUB_OUTPUT"
              {
                echo "## Execucao bloqueada"
                echo
                echo "A variavel \`DATA_MIGRATION_LOCKED\` esta ativa."
                echo "O coletor nao sera executado durante a migracao dos backups."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Execucao bloqueada pela migracao dos backups."
              ;;
            false)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "migration_locked=false" >> "$GITHUB_OUTPUT"
              echo "Execucao liberada. Agendamentos comecam com intervalo minimo de 6 horas."
              ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "migration_locked=invalid" >> "$GITHUB_OUTPUT"
              echo "::error::DATA_MIGRATION_LOCKED deve ser true ou false. Valor recebido: $DATA_MIGRATION_LOCKED"
              exit 1
              ;;
          esac

      - name: Checkout do codigo
        if: steps.janela.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Preparar contexto da execucao
        id: contexto_execucao
        if: steps.janela.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          timestamp="$(TZ=America/Sao_Paulo date +%Y%m%d_%H%M%S)"
          execution_id="${timestamp}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          execution_dir="data/logs/execucao/${execution_id}"

          {
            echo "COTACOES_EXECUTION_ID=${execution_id}"
            echo "COTACOES_EXECUTION_DIR=${execution_dir}"
            echo "COTACOES_EXECUTION_MANAGED=true"
          } >> "$GITHUB_ENV"
          {
            echo "execution_id=${execution_id}"
            echo "execution_dir=${execution_dir}"
          } >> "$GITHUB_OUTPUT"

          PYTHONPATH=src python -m cotacoes_ceasa.execution init \
            --directory "$execution_dir" \
            --execution-id "$execution_id"

      - name: Resolver variaveis do scraper
        if: steps.janela.outputs.should_run == 'true'
        id: scraper-vars
        env:
          REPO_COTACOES_TARGET_DATE: ${{ vars.COTACOES_TARGET_DATE || '' }}
          REPO_COTACOES_QUOTES_BACK: ${{ vars.COTACOES_QUOTES_BACK || '' }}
          REPO_COTACOES_INCREMENTAL_HISTORY: ${{ vars.COTACOES_INCREMENTAL_HISTORY || '' }}
          REPO_COTACOES_WORKERS: ${{ vars.COTACOES_WORKERS || '' }}
          REPO_COTACOES_REQUEST_DELAY_SECONDS: ${{ vars.COTACOES_REQUEST_DELAY_SECONDS || '' }}
          REPO_COTACOES_COMPLEMENT_PROHORT: ${{ vars.COTACOES_COMPLEMENT_PROHORT || '' }}
          REPO_COTACOES_SEND_REPORT_EMAIL: ${{ vars.COTACOES_SEND_REPORT_EMAIL || '' }}
        run: |
          set -euo pipefail

          resolve_value() {
            local name="$1"
            local repo="$2"
            local default="$3"
            local current="${!name:-}"

            if [ -n "$current" ]; then
              printf "%s" "$current"
            elif [ -n "$repo" ]; then
              printf "%s" "$repo"
            else
              printf "%s" "$default"
            fi
          }

          write_config() {
            local output_name="$1"
            local env_name="$2"
            local value="$3"

            echo "${output_name}=${value}" >> "$GITHUB_OUTPUT"
            echo "${env_name}=${value}" >> "$GITHUB_ENV"
          }

          target_date="$(resolve_value COTACOES_TARGET_DATE "$REPO_COTACOES_TARGET_DATE" "")"
          quotes_back="$(resolve_value COTACOES_QUOTES_BACK "$REPO_COTACOES_QUOTES_BACK" "100")"
          incremental_history="$(resolve_value COTACOES_INCREMENTAL_HISTORY "$REPO_COTACOES_INCREMENTAL_HISTORY" "false")"
          workers="$(resolve_value COTACOES_WORKERS "$REPO_COTACOES_WORKERS" "1")"
          request_delay_seconds="$(resolve_value COTACOES_REQUEST_DELAY_SECONDS "$REPO_COTACOES_REQUEST_DELAY_SECONDS" "7.0")"
          complement_prohort="$(resolve_value COTACOES_COMPLEMENT_PROHORT "$REPO_COTACOES_COMPLEMENT_PROHORT" "false")"
          send_report_email="$(resolve_value COTACOES_SEND_REPORT_EMAIL "$REPO_COTACOES_SEND_REPORT_EMAIL" "true")"

          write_config target_date COTACOES_TARGET_DATE "$target_date"
          write_config quotes_back COTACOES_QUOTES_BACK "$quotes_back"
          write_config incremental_history COTACOES_INCREMENTAL_HISTORY "$incremental_history"
          write_config workers COTACOES_WORKERS "$workers"
          write_config request_delay_seconds COTACOES_REQUEST_DELAY_SECONDS "$request_delay_seconds"
          write_config complement_prohort COTACOES_COMPLEMENT_PROHORT "$complement_prohort"
          write_config send_report_email COTACOES_SEND_REPORT_EMAIL "$send_report_email"

      - name: Conferir variaveis do scraper
        if: steps.janela.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          echo "Configuracao resolvida para esta execucao:"
          for name in COTACOES_QUOTES_BACK COTACOES_WORKERS COTACOES_REQUEST_DELAY_SECONDS COTACOES_INCREMENTAL_HISTORY COTACOES_COMPLEMENT_PROHORT COTACOES_SEND_REPORT_EMAIL; do
            echo "$name=${!name}"
          done

      - name: Criar configuracao do scraper
        if: steps.janela.outputs.should_run == 'true'
        uses: ./.github/actions/prepare-scraper
        with:
          target-date: ${{ steps.scraper-vars.outputs.target_date }}
          quotes-back: ${{ steps.scraper-vars.outputs.quotes_back }}
          incremental-history: ${{ steps.scraper-vars.outputs.incremental_history }}
          workers: ${{ steps.scraper-vars.outputs.workers }}
          request-delay-seconds: ${{ steps.scraper-vars.outputs.request_delay_seconds }}
          complement-prohort: ${{ steps.scraper-vars.outputs.complement_prohort }}

      - name: Contexto da execucao
        if: steps.janela.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Evento: $GITHUB_EVENT_NAME"
          date -u
          docker --version
          docker compose version

      - name: Resolver backup OneDrive
        id: onedrive_config
        if: steps.janela.outputs.should_run == 'true'
        env:
          RCLONE_CONFIG_PRESENT: ${{ secrets.RCLONE_CONFIG != '' && 'true' || 'false' }}
        run: |
          set -euo pipefail

          onedrive_enabled=false

          if [ "$DATA_ONEDRIVE_BACKUP_ENABLED" = "true" ]; then
            if [ "$RCLONE_CONFIG_PRESENT" = "true" ]; then
              onedrive_enabled=true
              echo "Backup OneDrive ativo."
            else
              echo "Backup OneDrive solicitado, mas RCLONE_CONFIG nao foi configurado. O workflow seguira sem OneDrive."
            fi
          else
            echo "Backup OneDrive desativado. O workflow seguira pelo fluxo GitHub Release."
          fi

          echo "enabled=${onedrive_enabled}" >> "$GITHUB_OUTPUT"

      - name: Resolver nomes dos artefatos
        id: data_assets
        if: steps.janela.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          release_asset_name="$DATA_ASSET_NAME"
          onedrive_asset_name="ceasa-data-latest.zip"

          if [[ "$release_asset_name" == *.gz ]]; then
            echo "DATA_ASSET_NAME nao pode mais usar .gz: $release_asset_name."
            echo "Use um nome .xz, como cotacoes.sqlite.xz."
            exit 1
          fi

          if [[ "$release_asset_name" != *.xz ]]; then
            echo "DATA_ASSET_NAME deve terminar com .xz: $release_asset_name."
            exit 1
          fi

          echo "DATA_ASSET_NAME=$release_asset_name" >> "$GITHUB_ENV"
          echo "release_asset_name=$release_asset_name" >> "$GITHUB_OUTPUT"
          echo "onedrive_asset_name=$onedrive_asset_name" >> "$GITHUB_OUTPUT"

      - name: Build da imagem Docker
        if: steps.janela.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m cotacoes_ceasa.execution record \
            --directory "$COTACOES_EXECUTION_DIR" \
            --execution-id "$COTACOES_EXECUTION_ID" \
            --stage building-image
          docker compose build

      - name: Registrar inicio da restauracao
        if: steps.janela.outputs.should_run == 'true'
        run: |
          PYTHONPATH=src python -m cotacoes_ceasa.execution record \
            --directory "$COTACOES_EXECUTION_DIR" \
            --execution-id "$COTACOES_EXECUTION_ID" \
            --stage restoring-data

      - name: Restaurar pacote atual
        id: restaurar_data
        if: steps.janela.outputs.should_run == 'true'
        uses: ./.github/actions/restore-release-data
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release-tag: ${{ env.DATA_RELEASE_TAG }}
          asset-name: ${{ steps.data_assets.outputs.release_asset_name }}
          backup-asset-name: ${{ steps.data_assets.outputs.onedrive_asset_name }}
          backup-enabled: ${{ steps.onedrive_config.outputs.enabled }}
          rclone-config: ${{ secrets.RCLONE_CONFIG }}
          rclone-remote: ${{ env.DATA_ONEDRIVE_REMOTE }}
          backup-dir: ${{ env.DATA_ONEDRIVE_DIR }}

      - name: Executar scraper
        id: executar_scraper
        if: steps.janela.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          started_at="$(date +%s)"

          finish() {
            local finished_at duration
            finished_at="$(date +%s)"
            duration=$((finished_at - started_at))
            echo "duration_seconds=${duration}" >> "$GITHUB_OUTPUT"
          }

          trap finish EXIT
          docker compose run --rm \
            -e COTACOES_EXECUTION_ID \
            -e COTACOES_EXECUTION_DIR \
            -e COTACOES_EXECUTION_MANAGED \
            -e COTACOES_EXECUTION_STEP=scraper \
            app \
            --download-and-process \
            --collection-mode current \
            --health-report-path "$COTACOES_EXECUTION_DIR/etapas/saude.json" \
            2>&1 | tee -a "$COTACOES_EXECUTION_DIR/console.log"
          scraper_status="${PIPESTATUS[0]}"
          exit "$scraper_status"

      - name: Conferir pasta data gerada
        id: conferir_data
        if: steps.janela.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          started_at="$(date +%s)"

          finish() {
            local finished_at duration data_size data_files
            finished_at="$(date +%s)"
            duration=$((finished_at - started_at))
            data_size="$(du -sh data 2>/dev/null | cut -f 1 || true)"
            data_files="$(find data -type f 2>/dev/null | wc -l || true)"

            {
              echo "duration_seconds=${duration}"
              echo "data_size=${data_size:-nao gerado}"
              echo "data_files=${data_files:-0}"
            } >> "$GITHUB_OUTPUT"
          }

          trap finish EXIT

          if [ ! -d data ]; then
            echo "A pasta data/ nao foi gerada."
            exit 1
          fi

          echo "Resumo de data/:"
          du -sh data
          echo "Arquivos principais:"
          find data -maxdepth 2 -type f | sort | head -n 50
          echo "Logs da execucao atual:"
          find "$COTACOES_EXECUTION_DIR" -maxdepth 2 -type f | sort || true

      - name: Validar checkpoint interno
        id: gate_checkpoint
        if: steps.janela.outputs.should_run == 'true'
        run: |
          set -uo pipefail
          docker compose run --rm \
            -e COTACOES_EXECUTION_ID \
            -e COTACOES_EXECUTION_DIR \
            -e COTACOES_EXECUTION_MANAGED \
            -e COTACOES_EXECUTION_STEP=gate-checkpoint \
            app \
            --validate-checkpoint \
            --health-report-path "$COTACOES_EXECUTION_DIR/etapas/saude.json" \
            --publication-gate-report-path "$COTACOES_EXECUTION_DIR/etapas/gate-checkpoint.json" \
            2>&1 | tee -a "$COTACOES_EXECUTION_DIR/console.log"
          gate_status="${PIPESTATUS[0]}"
          exit "$gate_status"

      - name: Validar gate de publicacao
        id: gate_publicacao
        if: steps.janela.outputs.should_run == 'true' && steps.gate_checkpoint.outcome == 'success'
        env:
          BYPASS_PUBLICATION_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.bypass_publication_gate && 'true' || 'false' }}
        run: |
          set -euo pipefail

          set +e
          docker compose run --rm \
            -e COTACOES_EXECUTION_ID \
            -e COTACOES_EXECUTION_DIR \
            -e COTACOES_EXECUTION_MANAGED \
            -e COTACOES_EXECUTION_STEP=gate-publicacao \
            app \
            --validate-publication \
            --health-report-path "$COTACOES_EXECUTION_DIR/etapas/saude.json" \
            --publication-gate-report-path "$COTACOES_EXECUTION_DIR/etapas/gate-publicacao.json" \
            2>&1 | tee -a "$COTACOES_EXECUTION_DIR/console.log"
          gate_exit_code="${PIPESTATUS[0]}"
          set -e

          if [ "$gate_exit_code" -eq 0 ]; then
            echo "Gate de publicacao aprovado."
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "decision=approved" >> "$GITHUB_OUTPUT"
            echo "bypassed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$gate_exit_code" -ne 2 ]; then
            echo "O gate de publicacao falhou inesperadamente com codigo ${gate_exit_code}."
            exit "$gate_exit_code"
          fi

          if [ "$BYPASS_PUBLICATION_GATE" = "true" ]; then
            echo "::warning::Gate reprovado com codigo ${gate_exit_code}, mas a excecao manual foi confirmada no workflow_dispatch."
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "decision=bypassed" >> "$GITHUB_OUTPUT"
            echo "bypassed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Gate de publicacao reprovado. A Release anterior sera preservada e o checkpoint interno podera ser salvo."
          echo "approved=false" >> "$GITHUB_OUTPUT"
          echo "decision=rejected" >> "$GITHUB_OUTPUT"
          echo "bypassed=false" >> "$GITHUB_OUTPUT"

      - name: Registrar ambiente no relatorio
        if: always() && steps.janela.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          if [ -d data ]; then
            sudo chown "$(id -u):$(id -g)" data || true
          fi

          sudo chown -R "$(id -u):$(id -g)" "$COTACOES_EXECUTION_DIR" || true

          latest_report="$COTACOES_EXECUTION_DIR/etapas/scraper.md"
          if [ ! -f "$latest_report" ]; then
            latest_report="$COTACOES_EXECUTION_DIR/resumo.md"
            {
              echo "# Ambiente do workflow"
              echo
              echo "Nenhum relatorio do scraper foi encontrado. Este relatorio foi criado pelo workflow para registrar o ambiente do runner."
            } > "$latest_report"
          fi

          single_line() {
            "$@" 2>/dev/null | tr '\n' ' ' | sed 's/[[:space:]][[:space:]]*/ /g; s/^ //; s/ $//'
          }

          read_meminfo_kb() {
            local field="$1"
            awk -v field="$field" '$1 == field ":" { print $2 }' /proc/meminfo 2>/dev/null || true
          }

          format_kb() {
            local value="$1"

            if [ -z "$value" ]; then
              echo "nao identificado"
              return
            fi

            awk -v kb="$value" 'BEGIN { printf "%.1f GiB", kb / 1024 / 1024 }'
          }

          cpu_model="$(awk -F': ' '/model name/ { print $2; exit }' /proc/cpuinfo 2>/dev/null || true)"
          cpu_model="${cpu_model:-nao identificado}"
          cpu_count="$(nproc 2>/dev/null || true)"
          cpu_count="${cpu_count:-nao identificado}"
          mem_total="$(format_kb "$(read_meminfo_kb MemTotal)")"
          mem_available="$(format_kb "$(read_meminfo_kb MemAvailable)")"
          workspace_usage="$(du -sh "$GITHUB_WORKSPACE" 2>/dev/null | cut -f 1 || true)"
          workspace_usage="${workspace_usage:-nao identificado}"
          workspace_disk="$(df -h "$GITHUB_WORKSPACE" 2>/dev/null | awk 'NR == 2 { print $2 " total, " $4 " livre, " $5 " usado" }' || true)"
          workspace_disk="${workspace_disk:-nao identificado}"
          docker_version="$(single_line docker --version)"
          docker_version="${docker_version:-nao identificado}"
          compose_version="$(single_line docker compose version)"
          compose_version="${compose_version:-nao identificado}"
          runner_os_release="$(single_line bash -c 'cat /etc/os-release')"
          runner_os_release="${runner_os_release:-nao identificado}"

          {
            echo
            echo "## Contexto do workflow"
            echo
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| Run ID | ${GITHUB_RUN_ID} |"
            echo "| Run attempt | ${GITHUB_RUN_ATTEMPT} |"
            echo "| Evento | ${GITHUB_EVENT_NAME} |"
            echo "| Ref | ${GITHUB_REF} |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Release tag | ${DATA_RELEASE_TAG} |"
            echo "| Banco GitHub | ${DATA_ASSET_NAME} |"
            echo "| Pacote latest OneDrive | ${{ steps.data_assets.outputs.onedrive_asset_name }} |"
            echo "| Gate do checkpoint | ${{ steps.gate_checkpoint.outcome }} |"
            echo "| Gate de publicacao | ${{ steps.gate_publicacao.outputs.decision || 'nao executado' }} |"
            echo "| Excecao manual do gate | ${{ steps.gate_publicacao.outputs.bypassed || 'false' }} |"
            echo
            echo "## Ambiente do runner"
            echo
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| Runner OS | ${RUNNER_OS:-nao identificado} |"
            echo "| Runner arch | ${RUNNER_ARCH:-nao identificado} |"
            echo "| Runner name | ${RUNNER_NAME:-nao identificado} |"
            echo "| Runner temp | ${RUNNER_TEMP:-nao identificado} |"
            echo "| Workspace | ${GITHUB_WORKSPACE:-nao identificado} |"
            echo "| Hostname | $(hostname 2>/dev/null || echo nao identificado) |"
            echo "| Kernel | $(uname -a 2>/dev/null || echo nao identificado) |"
            echo "| OS release | ${runner_os_release} |"
            echo "| CPU | ${cpu_model} |"
            echo "| CPUs disponiveis | ${cpu_count} |"
            echo "| Memoria total | ${mem_total} |"
            echo "| Memoria disponivel | ${mem_available} |"
            echo "| Uso do workspace | ${workspace_usage} |"
            echo "| Disco do workspace | ${workspace_disk} |"
            echo "| Docker | ${docker_version} |"
            echo "| Docker Compose | ${compose_version} |"
          } >> "$latest_report"

          echo "Ambiente registrado no relatorio: $latest_report"

      - name: Aplicar retencao segura dos logs operacionais
        if: ${{ !cancelled() && steps.contexto_execucao.outcome == 'success' }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" data/logs/execucao || true
          PYTHONPATH=src python -m cotacoes_ceasa.execution cleanup \
            --root data/logs/execucao \
            --current-directory "$COTACOES_EXECUTION_DIR" \
            --max-age-days "$COTACOES_EXECUTION_RETENTION_DAYS" \
            --max-count "$COTACOES_EXECUTION_RETENTION_COUNT"

      - name: Executar backups em camadas no OneDrive
        id: backups_onedrive
        if: ${{ !cancelled() && steps.janela.outputs.should_run == 'true' && steps.gate_checkpoint.outcome == 'success' && steps.onedrive_config.outputs.enabled == 'true' }}
        continue-on-error: true
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail

          runtime_dir=".backup-work/${COTACOES_EXECUTION_ID}"
          config_path="${runtime_dir}/rclone.conf"
          result_path="${COTACOES_EXECUTION_DIR}/etapas/backup-workflow.json"

          cleanup() {
            case "$runtime_dir" in
              .backup-work/*)
                sudo rm -rf -- "$runtime_dir"
                ;;
              *)
                echo "::warning::Diretorio temporario inesperado: $runtime_dir"
                ;;
            esac
          }
          trap cleanup EXIT

          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          printf "%s\n" "$RCLONE_CONFIG_CONTENT" > "$config_path"
          chmod 600 "$config_path"

          set +e
          docker compose run --rm \
            -e COTACOES_EXECUTION_ID \
            -e COTACOES_EXECUTION_DIR \
            -e DATA_ONEDRIVE_REMOTE \
            -e DATA_ONEDRIVE_DIR \
            -e DATA_ONEDRIVE_DAILY_RETENTION_DAYS \
            -e DATA_ONEDRIVE_DEEP_RETENTION_DAYS \
            -e DATA_ONEDRIVE_AUDIT_RETENTION_DAYS \
            -e RCLONE_CONFIG="/app/${config_path}" \
            --entrypoint python \
            app scripts/executar_backups.py \
            --execution-id "$COTACOES_EXECUTION_ID" \
            --diretorio-execucao "$COTACOES_EXECUTION_DIR" \
            --origem data \
            --trabalho "/app/${runtime_dir}/packages" \
            --resultado "$result_path"
          backup_exit_code=$?
          set -e

          sudo chown -R "$(id -u):$(id -g)" data || true

          python - "$result_path" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          result_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          result = json.loads(result_path.read_text(encoding="utf-8"))

          def scalar(value):
              if value is None:
                  return ""
              if isinstance(value, bool):
                  return str(value).lower()
              return str(value).replace("\r", " ").replace("\n", " ")

          def layer_value(layer_name, section, field):
              layer = result.get("layers", {}).get(layer_name, {})
              return layer.get(section, {}).get(field)

          values = {
              "status": result.get("status"),
              "result_path": result_path.as_posix(),
              "manifest_path": result.get("manifest_path"),
              "latest_status": result.get("layers", {}).get("latest", {}).get("status"),
              "latest_size_bytes": layer_value("latest", "package", "size_bytes"),
              "latest_compression_seconds": layer_value("latest", "package", "compression_duration_seconds"),
              "latest_upload_seconds": layer_value("latest", "publication", "duration_seconds"),
              "latest_path": layer_value("latest", "publication", "final_path"),
              "daily_status": result.get("layers", {}).get("daily", {}).get("status"),
              "daily_size_bytes": layer_value("daily", "package", "size_bytes"),
              "daily_compression_seconds": layer_value("daily", "package", "compression_duration_seconds"),
              "daily_upload_seconds": layer_value("daily", "publication", "duration_seconds"),
              "daily_path": layer_value("daily", "publication", "final_path"),
              "deep_status": result.get("layers", {}).get("deep", {}).get("status"),
              "deep_size_bytes": layer_value("deep", "package", "size_bytes"),
              "deep_compression_seconds": layer_value("deep", "package", "compression_duration_seconds"),
              "deep_upload_seconds": layer_value("deep", "publication", "duration_seconds"),
              "deep_path": layer_value("deep", "publication", "final_path"),
              "retention_status": (result.get("retention") or {}).get("status"),
              "removed_files": len((result.get("retention") or {}).get("removed_files", [])),
              "audit_status": (result.get("audit_publication") or {}).get("status"),
              "audit_path": (result.get("audit_publication") or {}).get("final_path"),
              "quota_before_used": (result.get("quota", {}).get("before") or {}).get("used"),
              "quota_before_free": (result.get("quota", {}).get("before") or {}).get("free"),
              "quota_after_used": (result.get("quota", {}).get("after") or {}).get("used"),
              "quota_after_free": (result.get("quota", {}).get("after") or {}).get("free"),
          }
          with output_path.open("a", encoding="utf-8") as output_file:
              for name, value in values.items():
                  output_file.write(f"{name}={scalar(value)}\n")
          PY

          exit "$backup_exit_code"

      - name: Compactar banco para GitHub
        id: banco_github
        if: steps.janela.outputs.should_run == 'true' && steps.gate_publicacao.outputs.approved == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          started_at="$(date +%s)"

          finish() {
            local finished_at duration database_size
            finished_at="$(date +%s)"
            duration=$((finished_at - started_at))
            database_size="$(du -h "$DATA_ASSET_NAME" 2>/dev/null | cut -f 1 || true)"

            {
              echo "duration_seconds=${duration}"
              echo "database_size=${database_size:-nao gerado}"
            } >> "$GITHUB_OUTPUT"
          }

          trap finish EXIT

          docker compose run --rm --entrypoint python app \
            scripts/cotacoes.py compactar-banco --arquivo "$DATA_ASSET_NAME"
          ls -lh "$DATA_ASSET_NAME"

      - name: Publicar banco na release fixa
        id: publicar_github
        if: steps.janela.outputs.should_run == 'true' && steps.gate_publicacao.outputs.approved == 'true' && steps.banco_github.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/publish-release-data
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release-tag: ${{ env.DATA_RELEASE_TAG }}
          asset-name: ${{ steps.data_assets.outputs.release_asset_name }}

      - name: Validar salvamento da rodada
        id: validar_salvamento
        if: ${{ !cancelled() && steps.janela.outputs.should_run == 'true' && steps.gate_checkpoint.outcome == 'success' }}
        run: |
          set -euo pipefail

          scraper_outcome="${{ steps.executar_scraper.outcome }}"
          publication_approved="${{ steps.gate_publicacao.outputs.approved || 'false' }}"
          onedrive_outcome="${{ steps.backups_onedrive.outcome }}"
          latest_status="${{ steps.backups_onedrive.outputs.latest_status }}"
          github_outcome="${{ steps.publicar_github.outcome }}"
          saved=false

          if [ "${{ steps.onedrive_config.outputs.enabled }}" = "true" ]; then
            if [ "$onedrive_outcome" != "success" ] || [ "$latest_status" != "completed" ]; then
              echo "A camada latest solicitada nao foi salva corretamente no OneDrive."
              exit 1
            fi
            saved=true
            echo "Camadas de backup salvas no OneDrive."
          fi

          if [ "$github_outcome" = "success" ]; then
            saved=true
            echo "Banco SQLite publicado na release do GitHub."
          fi

          if [ "$saved" != "true" ]; then
            echo "Nenhum pacote foi salvo fora do runner."
            exit 1
          fi

          if [ "$scraper_outcome" != "success" ]; then
            echo "O scraper terminou com falha, mas as tentativas de salvamento foram executadas."
            exit 1
          fi

          if [ "$publication_approved" = "true" ]; then
            echo "Rodada processada, salva e liberada para publicacao."
          else
            echo "Checkpoint interno salvo. A Release anterior foi preservada pelo gate de publicacao."
          fi

      - name: Registrar salvamento no relatorio
        if: always() && steps.janela.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          if [ -d data ]; then
            sudo chown "$(id -u):$(id -g)" data || true
          fi

          sudo chown -R "$(id -u):$(id -g)" "$COTACOES_EXECUTION_DIR" || true

          latest_report="$COTACOES_EXECUTION_DIR/etapas/scraper.md"
          if [ ! -f "$latest_report" ]; then
            latest_report="$COTACOES_EXECUTION_DIR/resumo.md"
            {
              echo "# Salvamento do workflow"
              echo
              echo "Nenhum relatorio do scraper foi encontrado. Este relatorio foi criado pelo workflow para registrar as etapas de salvamento."
            } > "$latest_report"
          fi

          github_size="nao gerado"
          if [ -f "$DATA_ASSET_NAME" ]; then
            github_size=$(du -h "$DATA_ASSET_NAME" | cut -f 1)
          fi

          saved_outside_runner="nao"
          if [ "${{ steps.backups_onedrive.outcome }}" = "success" ] || [ "${{ steps.publicar_github.outcome }}" = "success" ]; then
            saved_outside_runner="sim"
          fi

          {
            echo
            echo "## Salvamento e backups do workflow"
            echo
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| Run ID | ${GITHUB_RUN_ID} |"
            echo "| Run attempt | ${GITHUB_RUN_ATTEMPT} |"
            echo "| Evento | ${GITHUB_EVENT_NAME} |"
            echo "| Ref | ${GITHUB_REF} |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Pacote salvo fora do runner | ${saved_outside_runner} |"
            echo "| OneDrive solicitado | ${DATA_ONEDRIVE_BACKUP_ENABLED} |"
            echo "| OneDrive ativo efetivo | ${{ steps.onedrive_config.outputs.enabled }} |"
            echo "| OneDrive remote | ${DATA_ONEDRIVE_REMOTE} |"
            echo "| OneDrive diretorio | ${DATA_ONEDRIVE_DIR} |"
            echo "| Pacote latest OneDrive | ${{ steps.data_assets.outputs.onedrive_asset_name }} |"
            echo "| Tamanho latest (bytes) | ${{ steps.backups_onedrive.outputs.latest_size_bytes || 'nao gerado' }} |"
            echo "| Banco GitHub | ${DATA_ASSET_NAME} |"
            echo "| Tamanho banco GitHub | ${github_size} |"
            echo "| Release tag | ${DATA_RELEASE_TAG} |"
            echo
            echo "| Etapa | Resultado |"
            echo "| --- | --- |"
            echo "| Resolver backup OneDrive | ${{ steps.onedrive_config.outcome }} |"
            echo "| Restaurar pacote atual | ${{ steps.restaurar_data.outcome }} |"
            echo "| Executar scraper | ${{ steps.executar_scraper.outcome }} |"
            echo "| Conferir data/ | ${{ steps.conferir_data.outcome }} |"
            echo "| Gate do checkpoint | ${{ steps.gate_checkpoint.outcome }} |"
            echo "| Gate de publicacao | ${{ steps.gate_publicacao.outputs.decision || 'nao executado' }} |"
            echo "| Excecao manual do gate | ${{ steps.gate_publicacao.outputs.bypassed || 'false' }} |"
            echo "| Executar backups em camadas | ${{ steps.backups_onedrive.outcome }} |"
            echo "| Publicar latest | ${{ steps.backups_onedrive.outputs.latest_status || 'nao executado' }} |"
            echo "| Publicar daily | ${{ steps.backups_onedrive.outputs.daily_status || 'nao executado' }} |"
            echo "| Publicar deep | ${{ steps.backups_onedrive.outputs.deep_status || 'nao executado' }} |"
            echo "| Publicar manifesto audit | ${{ steps.backups_onedrive.outputs.audit_status || 'nao executado' }} |"
            echo "| Aplicar retencao | ${{ steps.backups_onedrive.outputs.retention_status || 'nao executado' }} |"
            echo "| Compactar banco GitHub | ${{ steps.banco_github.outcome }} |"
            echo "| Publicar release GitHub | ${{ steps.publicar_github.outcome }} |"
            echo "| Validar salvamento | ${{ steps.validar_salvamento.outcome }} |"
            echo
            echo "## Metricas de desempenho do workflow"
            echo
            echo "| Metrica | Valor |"
            echo "| --- | --- |"
            echo "| Tempo restauracao dados (s) | ${{ steps.restaurar_data.outputs.duration_seconds || 'nao medido' }} |"
            echo "| Restauracao origem | ${{ steps.restaurar_data.outputs.restored_source || 'nao identificado' }} |"
            echo "| Restauracao asset | ${{ steps.restaurar_data.outputs.restored_asset || 'nenhum' }} |"
            echo "| Tamanho data apos restauracao | ${{ steps.restaurar_data.outputs.data_size || 'nao medido' }} |"
            echo "| Tempo scraper (s) | ${{ steps.executar_scraper.outputs.duration_seconds || 'nao medido' }} |"
            echo "| Tempo conferencia data (s) | ${{ steps.conferir_data.outputs.duration_seconds || 'nao medido' }} |"
            echo "| Tamanho data final | ${{ steps.conferir_data.outputs.data_size || 'nao medido' }} |"
            echo "| Arquivos em data final | ${{ steps.conferir_data.outputs.data_files || 'nao medido' }} |"
            echo "| Compactacao latest (s) | ${{ steps.backups_onedrive.outputs.latest_compression_seconds || 'nao medido' }} |"
            echo "| Upload latest (s) | ${{ steps.backups_onedrive.outputs.latest_upload_seconds || 'nao medido' }} |"
            echo "| Caminho latest | ${{ steps.backups_onedrive.outputs.latest_path || 'nao gerado' }} |"
            echo "| Compactacao daily (s) | ${{ steps.backups_onedrive.outputs.daily_compression_seconds || 'nao medido' }} |"
            echo "| Upload daily (s) | ${{ steps.backups_onedrive.outputs.daily_upload_seconds || 'nao medido' }} |"
            echo "| Caminho daily | ${{ steps.backups_onedrive.outputs.daily_path || 'nao gerado' }} |"
            echo "| Compactacao deep (s) | ${{ steps.backups_onedrive.outputs.deep_compression_seconds || 'nao medido' }} |"
            echo "| Upload deep (s) | ${{ steps.backups_onedrive.outputs.deep_upload_seconds || 'nao medido' }} |"
            echo "| Caminho deep | ${{ steps.backups_onedrive.outputs.deep_path || 'nao gerado' }} |"
            echo "| Caminho audit | ${{ steps.backups_onedrive.outputs.audit_path || 'nao gerado' }} |"
            echo "| Arquivos removidos pela retencao | ${{ steps.backups_onedrive.outputs.removed_files || '0' }} |"
            echo "| OneDrive usado antes (bytes) | ${{ steps.backups_onedrive.outputs.quota_before_used || 'indisponivel' }} |"
            echo "| OneDrive livre antes (bytes) | ${{ steps.backups_onedrive.outputs.quota_before_free || 'indisponivel' }} |"
            echo "| OneDrive usado depois (bytes) | ${{ steps.backups_onedrive.outputs.quota_after_used || 'indisponivel' }} |"
            echo "| OneDrive livre depois (bytes) | ${{ steps.backups_onedrive.outputs.quota_after_free || 'indisponivel' }} |"
            echo "| Tempo compactacao banco (s) | ${{ steps.banco_github.outputs.duration_seconds || 'nao medido' }} |"
            echo "| Tamanho banco compactado | ${{ steps.banco_github.outputs.database_size || 'nao gerado' }} |"
            echo "| Tempo publicacao release (s) | ${{ steps.publicar_github.outputs.duration_seconds || 'nao medido' }} |"
            echo "| Assets legados removidos da release | ${{ steps.publicar_github.outputs.removed_legacy_assets || 'nenhum' }} |"
          } >> "$latest_report"

          echo "Salvamento registrado no relatorio: $latest_report"

      - name: Preparar resumo da execucao
        if: always() && steps.contexto_execucao.outcome == 'success'
        env:
          WORKFLOW_CURRENT_STATUS: ${{ job.status }}
          COTACOES_RESULT_RESTORE_OUTCOME: ${{ steps.restaurar_data.outcome }}
          COTACOES_RESULT_RESTORE_SOURCE: ${{ steps.restaurar_data.outputs.restored_source }}
          COTACOES_RESULT_RESTORE_ASSET: ${{ steps.restaurar_data.outputs.restored_asset }}
          COTACOES_RESULT_RESTORE_DURATION: ${{ steps.restaurar_data.outputs.duration_seconds }}
          COTACOES_RESULT_RESTORE_SIZE: ${{ steps.restaurar_data.outputs.data_size }}
          COTACOES_RESULT_RESTORE_VALIDATION: ${{ steps.restaurar_data.outputs.validation_status }}
          COTACOES_RESULT_RESTORE_CHECKSUM: ${{ steps.restaurar_data.outputs.checksum_validation }}
          COTACOES_RESULT_RESTORE_MANIFEST: ${{ steps.restaurar_data.outputs.manifest_status }}
          COTACOES_RESULT_SCRAPER_OUTCOME: ${{ steps.executar_scraper.outcome }}
          COTACOES_RESULT_CHECKPOINT_OUTCOME: ${{ steps.gate_checkpoint.outcome }}
          COTACOES_RESULT_GATE_OUTCOME: ${{ steps.gate_publicacao.outcome }}
          COTACOES_RESULT_GATE_DECISION: ${{ steps.gate_publicacao.outputs.decision }}
          COTACOES_RESULT_GATE_BYPASSED: ${{ steps.gate_publicacao.outputs.bypassed }}
          COTACOES_RESULT_ONEDRIVE_PACKAGE_OUTCOME: ${{ steps.backups_onedrive.outcome }}
          COTACOES_RESULT_ONEDRIVE_PACKAGE_DURATION: ${{ steps.backups_onedrive.outputs.latest_compression_seconds }}
          COTACOES_RESULT_ONEDRIVE_PACKAGE_SIZE: ${{ steps.backups_onedrive.outputs.latest_size_bytes }}
          COTACOES_RESULT_ONEDRIVE_UPLOAD_OUTCOME: ${{ steps.backups_onedrive.outputs.latest_status }}
          COTACOES_RESULT_ONEDRIVE_UPLOAD_DURATION: ${{ steps.backups_onedrive.outputs.latest_upload_seconds }}
          COTACOES_RESULT_ONEDRIVE_LATEST_PATH: ${{ steps.backups_onedrive.outputs.latest_path }}
          COTACOES_RESULT_ONEDRIVE_HISTORY_PATH: ${{ steps.backups_onedrive.outputs.daily_path }}
          COTACOES_RESULT_ONEDRIVE_BACKUP_RESULT: ${{ steps.backups_onedrive.outputs.result_path }}
          COTACOES_RESULT_GITHUB_PACKAGE_OUTCOME: ${{ steps.banco_github.outcome }}
          COTACOES_RESULT_GITHUB_PACKAGE_DURATION: ${{ steps.banco_github.outputs.duration_seconds }}
          COTACOES_RESULT_GITHUB_DATABASE_SIZE: ${{ steps.banco_github.outputs.database_size }}
          COTACOES_RESULT_GITHUB_UPLOAD_OUTCOME: ${{ steps.publicar_github.outcome }}
          COTACOES_RESULT_GITHUB_UPLOAD_DURATION: ${{ steps.publicar_github.outputs.duration_seconds }}
          COTACOES_RESULT_REMOVED_LEGACY_ASSETS: ${{ steps.publicar_github.outputs.removed_legacy_assets }}
          COTACOES_RESULT_SAVE_OUTCOME: ${{ steps.validar_salvamento.outcome }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$COTACOES_EXECUTION_DIR" || true

          execution_status=completed
          exit_code=0
          final_error=""
          if [ "$WORKFLOW_CURRENT_STATUS" = "cancelled" ]; then
            execution_status=cancelled
            exit_code=130
            final_error="O workflow foi cancelado antes da conclusao de todas as etapas."
          elif [ "$WORKFLOW_CURRENT_STATUS" != "success" ]; then
            execution_status=failed
            exit_code=1
            final_error="Uma ou mais etapas do workflow terminaram com falha."
          fi

          arguments=(
            --directory "$COTACOES_EXECUTION_DIR"
            --execution-id "$COTACOES_EXECUTION_ID"
            --status "$execution_status"
            --exit-code "$exit_code"
            --defer-finalization
          )
          if [ -n "$final_error" ]; then
            arguments+=(--error "$final_error")
          fi
          PYTHONPATH=src python scripts/finalizar_execucao.py "${arguments[@]}"

      - name: Enviar relatorio por email
        id: enviar_relatorio
        if: always() && steps.contexto_execucao.outcome == 'success'
        uses: ./.github/actions/send-report-email
        with:
          report-path: ${{ env.COTACOES_EXECUTION_DIR }}/resumo.md
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          COTACOES_SEND_REPORT_EMAIL: ${{ steps.scraper-vars.outputs.send_report_email }}
          WORKFLOW_STATUS: ${{ job.status }}

      - name: Consolidar logs da execucao
        if: always() && steps.contexto_execucao.outcome == 'success'
        env:
          WORKFLOW_CURRENT_STATUS: ${{ job.status }}
          COTACOES_RESULT_EMAIL_OUTCOME: ${{ steps.enviar_relatorio.outcome }}
          COTACOES_RESULT_ARTIFACT_OUTCOME: pending
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$COTACOES_EXECUTION_DIR" || true

          execution_status=completed
          exit_code=0
          final_error=""
          if [ "$WORKFLOW_CURRENT_STATUS" = "cancelled" ]; then
            execution_status=cancelled
            exit_code=130
            final_error="O workflow foi cancelado antes da conclusao de todas as etapas."
          elif [ "$WORKFLOW_CURRENT_STATUS" != "success" ]; then
            execution_status=failed
            exit_code=1
            final_error="Uma ou mais etapas do workflow, incluindo o envio do relatorio, terminaram com falha."
          fi

          arguments=(
            --directory "$COTACOES_EXECUTION_DIR"
            --execution-id "$COTACOES_EXECUTION_ID"
            --status "$execution_status"
            --exit-code "$exit_code"
          )
          if [ -n "$final_error" ]; then
            arguments+=(--error "$final_error")
          fi
          PYTHONPATH=src python scripts/finalizar_execucao.py "${arguments[@]}"

      - name: Preservar diagnosticos da rodada
        id: preservar_diagnosticos
        if: always() && steps.contexto_execucao.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-coleta-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.COTACOES_EXECUTION_DIR }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Registrar resultado da preservacao dos diagnosticos
        if: always() && steps.contexto_execucao.outcome == 'success'
        env:
          WORKFLOW_CURRENT_STATUS: ${{ job.status }}
          ARTIFACT_OUTCOME: ${{ steps.preservar_diagnosticos.outcome }}
          COTACOES_RESULT_ARTIFACT_OUTCOME: ${{ steps.preservar_diagnosticos.outcome }}
        run: |
          set -euo pipefail

          execution_status=completed
          exit_code=0
          final_error=""
          if [ "$WORKFLOW_CURRENT_STATUS" = "cancelled" ]; then
            execution_status=cancelled
            exit_code=130
            final_error="O workflow foi cancelado antes da conclusao de todas as etapas."
          elif [ "$WORKFLOW_CURRENT_STATUS" != "success" ] || [ "$ARTIFACT_OUTCOME" != "success" ]; then
            execution_status=failed
            exit_code=1
            final_error="Uma ou mais etapas do workflow terminaram com falha. Resultado do artifact: ${ARTIFACT_OUTCOME}."
          fi

          arguments=(
            --directory "$COTACOES_EXECUTION_DIR"
            --execution-id "$COTACOES_EXECUTION_ID"
            --status "$execution_status"
            --exit-code "$exit_code"
          )
          if [ -n "$final_error" ]; then
            arguments+=(--error "$final_error")
          fi
          PYTHONPATH=src python scripts/finalizar_execucao.py "${arguments[@]}"

          if [ "$ARTIFACT_OUTCOME" != "success" ]; then
            exit 1
          fi

      - name: Publicar resumo da execucao
        if: always() && steps.contexto_execucao.outcome == 'success'
        run: |
          if [ -f "$COTACOES_EXECUTION_DIR/resumo.md" ]; then
            cat "$COTACOES_EXECUTION_DIR/resumo.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A execucao nao gerou resumo." >> "$GITHUB_STEP_SUMMARY"
          fi
