name: Atualizar pacote de dados

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: latest-data-release
  cancel-in-progress: false

jobs:
  atualizar-dados:
    name: Gerar e publicar dados
    runs-on: ubuntu-latest
    environment: Crawler
    timeout-minutes: 360
    env:
      DATA_RELEASE_TAG: ${{ vars.DATA_RELEASE_TAG || 'latest-data' }}
      DATA_ASSET_NAME: ${{ vars.DATA_ASSET_NAME || 'cotacoes.sqlite.xz' }}
      DATA_ONEDRIVE_ASSET_NAME: ${{ vars.DATA_ONEDRIVE_ASSET_NAME || 'ceasa-data-full-latest.tar.xz' }}
      DATA_ONEDRIVE_BACKUP_ENABLED: ${{ vars.DATA_ONEDRIVE_BACKUP_ENABLED || 'false' }}
      DATA_ONEDRIVE_REMOTE: ${{ vars.DATA_ONEDRIVE_REMOTE || 'onedrive' }}
      DATA_ONEDRIVE_DIR: ${{ vars.DATA_ONEDRIVE_DIR || 'cotacoes-ceasa' }}

    steps:
      - name: Liberar execucao
        id: janela
        run: |
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Execucao liberada. Agendamentos comecam com intervalo minimo de 6 horas."

      - name: Checkout do codigo
        if: steps.janela.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Resolver variaveis do scraper
        if: steps.janela.outputs.should_run == 'true'
        id: scraper-vars
        env:
          REPO_COTACOES_TARGET_DATE: ${{ vars.COTACOES_TARGET_DATE || '' }}
          REPO_COTACOES_QUOTES_BACK: ${{ vars.COTACOES_QUOTES_BACK || '' }}
          REPO_COTACOES_INCREMENTAL_HISTORY: ${{ vars.COTACOES_INCREMENTAL_HISTORY || '' }}
          REPO_COTACOES_WORKERS: ${{ vars.COTACOES_WORKERS || '' }}
          REPO_COTACOES_REQUEST_DELAY_SECONDS: ${{ vars.COTACOES_REQUEST_DELAY_SECONDS || '' }}
          REPO_COTACOES_SEND_REPORT_EMAIL: ${{ vars.COTACOES_SEND_REPORT_EMAIL || '' }}
        run: |
          set -euo pipefail

          resolve_value() {
            local name="$1"
            local repo="$2"
            local default="$3"
            local current="${!name:-}"

            if [ -n "$current" ]; then
              printf "%s" "$current"
            elif [ -n "$repo" ]; then
              printf "%s" "$repo"
            else
              printf "%s" "$default"
            fi
          }

          write_config() {
            local output_name="$1"
            local env_name="$2"
            local value="$3"

            echo "${output_name}=${value}" >> "$GITHUB_OUTPUT"
            echo "${env_name}=${value}" >> "$GITHUB_ENV"
          }

          target_date="$(resolve_value COTACOES_TARGET_DATE "$REPO_COTACOES_TARGET_DATE" "")"
          quotes_back="$(resolve_value COTACOES_QUOTES_BACK "$REPO_COTACOES_QUOTES_BACK" "100")"
          incremental_history="$(resolve_value COTACOES_INCREMENTAL_HISTORY "$REPO_COTACOES_INCREMENTAL_HISTORY" "false")"
          workers="$(resolve_value COTACOES_WORKERS "$REPO_COTACOES_WORKERS" "1")"
          request_delay_seconds="$(resolve_value COTACOES_REQUEST_DELAY_SECONDS "$REPO_COTACOES_REQUEST_DELAY_SECONDS" "7.0")"
          send_report_email="$(resolve_value COTACOES_SEND_REPORT_EMAIL "$REPO_COTACOES_SEND_REPORT_EMAIL" "true")"

          write_config target_date COTACOES_TARGET_DATE "$target_date"
          write_config quotes_back COTACOES_QUOTES_BACK "$quotes_back"
          write_config incremental_history COTACOES_INCREMENTAL_HISTORY "$incremental_history"
          write_config workers COTACOES_WORKERS "$workers"
          write_config request_delay_seconds COTACOES_REQUEST_DELAY_SECONDS "$request_delay_seconds"
          write_config send_report_email COTACOES_SEND_REPORT_EMAIL "$send_report_email"

      - name: Conferir variaveis do scraper
        if: steps.janela.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          echo "Configuracao resolvida para esta execucao:"
          for name in COTACOES_QUOTES_BACK COTACOES_WORKERS COTACOES_REQUEST_DELAY_SECONDS COTACOES_INCREMENTAL_HISTORY COTACOES_SEND_REPORT_EMAIL; do
            echo "$name=${!name}"
          done

      - name: Criar configuracao do scraper
        if: steps.janela.outputs.should_run == 'true'
        uses: ./.github/actions/prepare-scraper
        with:
          target-date: ${{ steps.scraper-vars.outputs.target_date }}
          quotes-back: ${{ steps.scraper-vars.outputs.quotes_back }}
          incremental-history: ${{ steps.scraper-vars.outputs.incremental_history }}
          workers: ${{ steps.scraper-vars.outputs.workers }}
          request-delay-seconds: ${{ steps.scraper-vars.outputs.request_delay_seconds }}

      - name: Contexto da execucao
        if: steps.janela.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Evento: $GITHUB_EVENT_NAME"
          date -u
          docker --version
          docker compose version

      - name: Resolver backup OneDrive
        id: onedrive_config
        if: steps.janela.outputs.should_run == 'true'
        env:
          RCLONE_CONFIG_PRESENT: ${{ secrets.RCLONE_CONFIG != '' && 'true' || 'false' }}
        run: |
          set -euo pipefail

          onedrive_enabled=false

          if [ "$DATA_ONEDRIVE_BACKUP_ENABLED" = "true" ]; then
            if [ "$RCLONE_CONFIG_PRESENT" = "true" ]; then
              onedrive_enabled=true
              echo "Backup OneDrive ativo."
            else
              echo "Backup OneDrive solicitado, mas RCLONE_CONFIG nao foi configurado. O workflow seguira sem OneDrive."
            fi
          else
            echo "Backup OneDrive desativado. O workflow seguira pelo fluxo GitHub Release."
          fi

          echo "enabled=${onedrive_enabled}" >> "$GITHUB_OUTPUT"

      - name: Build da imagem Docker
        if: steps.janela.outputs.should_run == 'true'
        run: docker compose build

      - name: Restaurar pacote atual
        id: restaurar_data
        if: steps.janela.outputs.should_run == 'true'
        uses: ./.github/actions/restore-release-data
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release-tag: ${{ env.DATA_RELEASE_TAG }}
          asset-name: ${{ env.DATA_ASSET_NAME }}
          backup-asset-name: ${{ env.DATA_ONEDRIVE_ASSET_NAME }}
          backup-enabled: ${{ steps.onedrive_config.outputs.enabled }}
          rclone-config: ${{ secrets.RCLONE_CONFIG }}
          rclone-remote: ${{ env.DATA_ONEDRIVE_REMOTE }}
          backup-dir: ${{ env.DATA_ONEDRIVE_DIR }}

      - name: Executar scraper
        id: executar_scraper
        if: steps.janela.outputs.should_run == 'true'
        continue-on-error: true
        run: docker compose run --rm tudo

      - name: Conferir pasta data gerada
        id: conferir_data
        if: steps.janela.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail

          if [ ! -d data ]; then
            echo "A pasta data/ nao foi gerada."
            exit 1
          fi

          echo "Resumo de data/:"
          du -sh data
          echo "Arquivos principais:"
          find data -maxdepth 2 -type f | sort | head -n 50
          echo "Relatorios recentes:"
          find data/relatorios -maxdepth 1 -type f -printf "%TY-%Tm-%Td %TH:%TM %p\n" 2>/dev/null | sort | tail -n 10 || true

      - name: Compactar pacote completo para OneDrive
        id: pacote_onedrive
        if: steps.janela.outputs.should_run == 'true' && steps.onedrive_config.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          docker compose run --rm --entrypoint python app \
            scripts/cotacoes.py compactar --incluir-sqlite --arquivo "$DATA_ONEDRIVE_ASSET_NAME"
          ls -lh "$DATA_ONEDRIVE_ASSET_NAME"

      - name: Salvar backup do pacote no OneDrive
        id: backup_onedrive
        if: steps.janela.outputs.should_run == 'true' && steps.onedrive_config.outputs.enabled == 'true' && steps.pacote_onedrive.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/backup-release-data
        with:
          mode: upload
          asset-name: ${{ env.DATA_ONEDRIVE_ASSET_NAME }}
          rclone-config: ${{ secrets.RCLONE_CONFIG }}
          rclone-remote: ${{ env.DATA_ONEDRIVE_REMOTE }}
          backup-dir: ${{ env.DATA_ONEDRIVE_DIR }}

      - name: Compactar banco para GitHub
        id: banco_github
        if: steps.janela.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          docker compose run --rm --entrypoint python app \
            scripts/cotacoes.py compactar-banco --arquivo "$DATA_ASSET_NAME"
          ls -lh "$DATA_ASSET_NAME"

      - name: Publicar banco na release fixa
        id: publicar_github
        if: steps.janela.outputs.should_run == 'true' && steps.banco_github.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/publish-release-data
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release-tag: ${{ env.DATA_RELEASE_TAG }}
          asset-name: ${{ env.DATA_ASSET_NAME }}

      - name: Validar salvamento da rodada
        id: validar_salvamento
        if: steps.janela.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          scraper_outcome="${{ steps.executar_scraper.outcome }}"
          onedrive_outcome="${{ steps.backup_onedrive.outcome }}"
          github_outcome="${{ steps.publicar_github.outcome }}"
          saved=false

          if [ "${{ steps.onedrive_config.outputs.enabled }}" = "true" ] && [ "$onedrive_outcome" = "success" ]; then
            saved=true
            echo "Pacote completo salvo no OneDrive."
          fi

          if [ "$github_outcome" = "success" ]; then
            saved=true
            echo "Banco SQLite publicado na release do GitHub."
          fi

          if [ "$saved" != "true" ]; then
            echo "Nenhum pacote foi salvo fora do runner."
            exit 1
          fi

          if [ "$scraper_outcome" != "success" ]; then
            echo "O scraper terminou com falha, mas as tentativas de salvamento foram executadas."
            exit 1
          fi

          echo "Rodada processada e salva."

      - name: Registrar salvamento no relatorio
        if: always() && steps.janela.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          if [ -d data ]; then
            sudo chown "$(id -u):$(id -g)" data || true
          fi

          if [ -d data/relatorios ]; then
            sudo chown -R "$(id -u):$(id -g)" data/relatorios || true
          fi

          latest_report=""
          if [ -d data/relatorios ]; then
            latest_report=$(find data/relatorios -maxdepth 1 -type f -name "*.md" -printf "%T@ %p\n" | sort -n | tail -n 1 | cut -d " " -f 2-)
          fi

          if [ -z "$latest_report" ]; then
            mkdir -p data/relatorios
            timestamp=$(date -u +%Y%m%d_%H%M%S)
            latest_report="data/relatorios/workflow_salvamento_${timestamp}.md"
            {
              echo "# Salvamento do workflow"
              echo
              echo "Nenhum relatorio do scraper foi encontrado. Este relatorio foi criado pelo workflow para registrar as etapas de salvamento."
            } > "$latest_report"
          fi

          onedrive_size="nao gerado"
          if [ -f "$DATA_ONEDRIVE_ASSET_NAME" ]; then
            onedrive_size=$(du -h "$DATA_ONEDRIVE_ASSET_NAME" | cut -f 1)
          fi

          github_size="nao gerado"
          if [ -f "$DATA_ASSET_NAME" ]; then
            github_size=$(du -h "$DATA_ASSET_NAME" | cut -f 1)
          fi

          saved_outside_runner="nao"
          if [ "${{ steps.backup_onedrive.outcome }}" = "success" ] || [ "${{ steps.publicar_github.outcome }}" = "success" ]; then
            saved_outside_runner="sim"
          fi

          {
            echo
            echo "## Salvamento e backups do workflow"
            echo
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| Run ID | ${GITHUB_RUN_ID} |"
            echo "| Run attempt | ${GITHUB_RUN_ATTEMPT} |"
            echo "| Evento | ${GITHUB_EVENT_NAME} |"
            echo "| Ref | ${GITHUB_REF} |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Pacote salvo fora do runner | ${saved_outside_runner} |"
            echo "| OneDrive solicitado | ${DATA_ONEDRIVE_BACKUP_ENABLED} |"
            echo "| OneDrive ativo efetivo | ${{ steps.onedrive_config.outputs.enabled }} |"
            echo "| OneDrive remote | ${DATA_ONEDRIVE_REMOTE} |"
            echo "| OneDrive diretorio | ${DATA_ONEDRIVE_DIR} |"
            echo "| Pacote completo OneDrive | ${DATA_ONEDRIVE_ASSET_NAME} |"
            echo "| Tamanho pacote OneDrive | ${onedrive_size} |"
            echo "| Banco GitHub | ${DATA_ASSET_NAME} |"
            echo "| Tamanho banco GitHub | ${github_size} |"
            echo "| Release tag | ${DATA_RELEASE_TAG} |"
            echo
            echo "| Etapa | Resultado |"
            echo "| --- | --- |"
            echo "| Resolver backup OneDrive | ${{ steps.onedrive_config.outcome }} |"
            echo "| Restaurar pacote atual | ${{ steps.restaurar_data.outcome }} |"
            echo "| Executar scraper | ${{ steps.executar_scraper.outcome }} |"
            echo "| Conferir data/ | ${{ steps.conferir_data.outcome }} |"
            echo "| Compactar pacote completo OneDrive | ${{ steps.pacote_onedrive.outcome }} |"
            echo "| Salvar backup OneDrive | ${{ steps.backup_onedrive.outcome }} |"
            echo "| Compactar banco GitHub | ${{ steps.banco_github.outcome }} |"
            echo "| Publicar release GitHub | ${{ steps.publicar_github.outcome }} |"
            echo "| Validar salvamento | ${{ steps.validar_salvamento.outcome }} |"
          } >> "$latest_report"

          echo "Salvamento registrado no relatorio: $latest_report"

      - name: Enviar relatorio por email
        if: always() && steps.janela.outputs.should_run == 'true'
        uses: ./.github/actions/send-report-email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          COTACOES_SEND_REPORT_EMAIL: ${{ steps.scraper-vars.outputs.send_report_email }}
          WORKFLOW_STATUS: ${{ job.status }}
